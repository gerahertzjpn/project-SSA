<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autobattler Pixi Viewer</title>
  <link rel="stylesheet" href="./styles.css?v=20260610-faction-lock-v2">
  <script type="importmap">
    {
      "imports": {
        "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.10.0/dist/pixi.mjs"
      }
    }
  </script>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("worldTheme") || "aurora"; } catch (e) { document.documentElement.dataset.theme = "aurora"; }</script>
  <script>try { document.documentElement.lang = localStorage.getItem("worldLang") || "ru"; } catch (e) { document.documentElement.lang = "ru"; }</script>
</head>
<body>
  <main class="pixi-shell">
    <div id="pixiStage" aria-label="Pixi replay map"></div>

    <a id="backBtn" class="back-btn is-hidden" href="./home.html" data-i18n="← Back">&larr; Back</a>
    <div id="embedTitle" class="embed-title is-hidden" aria-live="polite"></div>

    <header id="topHud" class="hud top-hud compact" aria-label="Replay and match controls">
      <div class="top-row">
        <div class="brand">
          <a class="brand-menu" href="./home.html" title="Main menu" aria-label="Main menu">☰</a>
          <strong>Pixi Viewer</strong>
          <span id="metaText">load replay</span>
        </div>
        <div class="replay-controls">
          <select id="replaySelect" aria-label="Replay"></select>
          <button id="loadBtn" type="button" data-i18n="Load">Load</button>
          <label class="mini-field" title="Matches to generate" data-i18n-attr="title:Matches to generate">
            <span>Runs</span>
            <input id="generateCountInput" type="number" min="1" max="100" value="5" inputmode="numeric">
          </label>
          <label class="mini-field" title="Generation seed (blank = fresh random each run)" data-i18n-attr="title:Generation seed (blank = fresh random each run)">
            <span>Seed</span>
            <input id="generateSeedInput" type="number" placeholder="random" inputmode="numeric">
          </label>
          <button id="generateBtn" class="generate-command" type="button" data-i18n="Generate">Generate</button>
          <span id="generateStatus" class="generate-status" aria-live="polite" title=""></span>
          <button id="modelsToggleBtn" class="mini-command models-toggle" type="button" aria-pressed="false" data-i18n="All models">All models</button>
          <button id="configToggleBtn" class="mini-command config-toggle" type="button" aria-expanded="false" data-i18n="Config">Config</button>
        </div>
      </div>
      <div id="playerConfigGrid" class="player-config-grid" aria-label="Match players"></div>
    </header>

    <section class="hud bottom-hud" aria-label="Playback">
      <button id="prevBtn" type="button" title="Previous tick" aria-label="Previous tick">|&lt;</button>
      <button id="playBtn" type="button" class="primary" title="Play/Pause" aria-label="Play/Pause">&gt;</button>
      <button id="nextBtn" type="button" title="Next tick" aria-label="Next tick">&gt;|</button>
      <input id="tickSlider" type="range" min="0" max="0" value="0" aria-label="Replay tick">
      <div class="tick-readout"><span id="tickNow">0</span>/<span id="tickMax">0</span></div>
      <select id="speedSelect" aria-label="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </section>

    <aside id="inspectPanel" class="hud inspect-panel is-hidden" aria-live="polite">
      <div class="inspect-head">
        <h2 data-i18n="Selection">Selection</h2>
        <button id="inspectCloseBtn" class="mini-command" type="button" aria-label="Close selection" data-i18n="Close">Close</button>
      </div>
      <div id="inspectBody" data-i18n="Click a unit, room, or fight.">Click a unit, room, or fight.</div>
    </aside>
  </main>

  <div id="themeSwitch" class="theme-dock" role="group" aria-label="Appearance" data-i18n-attr="aria-label:Appearance">
    <button type="button" data-theme-pick="aurora" title="Aurora" aria-label="Aurora">◐</button>
    <button type="button" data-theme-pick="neon" title="Neon" aria-label="Neon">◑</button>
    <button type="button" data-theme-pick="vibrant" title="Vibrant" aria-label="Vibrant">◓</button>
  </div>
  <script>
    (function () {
      var sw = document.getElementById("themeSwitch");
      if (!sw) return;
      var btns = sw.querySelectorAll("button");
      function mark(t) {
        btns.forEach(function (b) { b.classList.toggle("is-active", b.dataset.themePick === t); });
      }
      sw.addEventListener("click", function (e) {
        var b = e.target.closest("[data-theme-pick]");
        if (!b) return;
        var t = b.dataset.themePick;
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem("worldTheme", t); } catch (err) {}
        mark(t);
      });
      mark(document.documentElement.dataset.theme || "aurora");
    })();
  </script>

  <script src="./i18n_catalog.js"></script>
  <script src="./i18n_extra.js"></script>
  <script src="./i18n.js"></script>
  <script type="module" src="./app.js?v=20260617-visual-rework"></script>
</body>
</html>
