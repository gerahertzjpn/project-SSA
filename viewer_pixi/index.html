<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autobattler Pixi Viewer</title>
  <link rel="stylesheet" href="./styles.css?v=20260604-pixi-v1">
  <script type="importmap">
    {
      "imports": {
        "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.10.0/dist/pixi.mjs"
      }
    }
  </script>
</head>
<body>
  <main class="pixi-shell">
    <div id="pixiStage" aria-label="Pixi replay map"></div>

    <header class="hud top-hud">
      <div class="brand">
        <strong>Pixi Viewer</strong>
        <span id="metaText">load replay</span>
      </div>
      <div class="controls">
        <select id="replaySelect" aria-label="Replay"></select>
        <button id="loadBtn" type="button">Load</button>
        <label class="mini-field" title="Matches to generate">
          <span>Matches</span>
          <input id="generateCountInput" type="number" min="1" max="100" value="20" inputmode="numeric">
        </label>
        <label class="mini-field" title="Generation seed">
          <span>Seed</span>
          <input id="generateSeedInput" type="number" value="20260602" inputmode="numeric">
        </label>
        <button id="generateBtn" type="button">Generate</button>
        <a class="link-button" href="../viewer_game/index.html">Canvas</a>
        <a class="link-button" href="../viewer/index.html">Diagnostics</a>
      </div>
      <div id="generateStatus" class="generate-status" aria-live="polite"></div>
    </header>

    <section class="hud bottom-hud" aria-label="Playback">
      <button id="prevBtn" type="button" title="Previous tick" aria-label="Previous tick">|&lt;</button>
      <button id="playBtn" type="button" class="primary" title="Play/Pause" aria-label="Play/Pause">&gt;</button>
      <button id="nextBtn" type="button" title="Next tick" aria-label="Next tick">&gt;|</button>
      <input id="tickSlider" type="range" min="0" max="0" value="0" aria-label="Replay tick">
      <div class="tick-readout"><span id="tickNow">0</span>/<span id="tickMax">0</span></div>
      <select id="speedSelect" aria-label="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </section>

    <aside id="inspectPanel" class="hud inspect-panel" aria-live="polite">
      <h2>Selection</h2>
      <div id="inspectBody">Click a unit, room, or fight.</div>
    </aside>
  </main>

  <script type="module" src="./app.js?v=20260604-pixi-v10"></script>
</body>
</html>
